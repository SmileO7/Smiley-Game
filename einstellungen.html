<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstellungen</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="settings-page">
    <header>
        <nav class="navbar">
            <a href="index.html">Start & Shop</a>
            <a href="prestige_shop.html">Prestige Shop</a>
            <a href="info.html">Info & Tipps</a>
            <a href="einstellungen.html" class="active">Einstellungen</a>
        </nav>
    </header>
    
    <main class="settings-main">
        <h1>Einstellungen</h1>

        <div class="settings-section">
            <h2>Audio</h2>
            <div class="setting-item">
                <label for="music-volume">Musik-Lautstärke</label>
                <input type="range" id="music-volume" min="0" max="100" value="50">
            </div>
            <div class="setting-item">
                <label for="sound-volume">Sound-Lautstärke</label>
                <input type="range" id="sound-volume" min="0" max="100" value="80">
            </div>
        </div>

        <div class="settings-section">
            <h2>Spielstand</h2>
            <p>Hier kannst du deinen Spielstand exportieren, um ihn auf einem anderen Gerät zu importieren oder als Backup zu sichern.</p>
            <div class="save-actions">
                <button id="export-save-button" class="btn-primary">Spielstand exportieren</button>
                <button id="import-save-button" class="btn-primary">Spielstand importieren</button>
            </div>
            <textarea id="save-data-textarea" placeholder="Füge hier deine Speicherdaten ein..."></textarea>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="SmileyGame.js"></script>
    <script src="main.js"></script>
</body>
</html>
