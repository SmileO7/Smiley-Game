name: Deploy Static Content to Pages

on:
  # Startet den Workflow bei jedem Push auf den 'main'-Branch
  push:
    branches: ["main"]
  # Ermöglicht manuelles Auslösen über die GitHub-Oberfläche
  workflow_dispatch:

# Definiert die notwendigen Berechtigungen
permissions:
  contents: read
  pages: write
  id-token: write

# Stellt sicher, dass immer nur ein Deployment läuft
concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Wir benötigen Node, um 'npm install' und 'npm run build' auszuführen
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project (generiert den dist-Ordner)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (lädt den dist-Ordner hoch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # WICHTIG: Pfad zum gebauten Spiel

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4